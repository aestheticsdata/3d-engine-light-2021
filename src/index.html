<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="styles/main.css">
    <script type="module" src="index.ts"></script>
  </head>

  <body>
    <div id="wrapper">
      <div id="canvasWrapper">
        <canvas id="canvasID" width="1024" height="640">canvas not available in this browser</canvas>
      </div>
      <div id="controls">
        <div class="controlsHeader">
          <button id="playPause">pause</button>
          <div class="toggleRow">
            <span class="toggleLabel">wireframe</span>
            <button id="toggleWireframe" type="button">off</button>
          </div>
          <div class="toggleRow">
            <span class="toggleLabel">backface culling</span>
            <button id="toggleBackfaceCulling" type="button">on</button>
          </div>
          <div id="selectButton">
            <select id="primitives">
            </select>
          </div>
          <div class="fpsRow">
            <span class="fpsCounter">FPS : </span><span id="fpsCounterNb" class="fpsCounter"></span>
          </div>
        </div>
        <div class="sliderGroup">
          <label class="sliderRow" for="zoomSlider">
            <span class="sliderText">zoom</span>
            <input id="zoomSlider" type="range" min="0" max="100" value="50" />
          </label>
          <label class="sliderRow" for="opacitySlider">
            <span class="sliderText">opacity</span>
            <input id="opacitySlider" type="range" min="0" max="100" value="100" />
          </label>
          <label class="sliderRow" for="pitchSlider">
            <span class="sliderText">pitch</span>
            <input id="pitchSlider" type="range" min="0" max="800" value="400" />
          </label>
          <label class="sliderRow" for="yawSlider">
            <span class="sliderText">yaw</span>
            <input id="yawSlider" type="range" min="0" max="800" value="400" />
          </label>
          <label class="sliderRow" for="rollSlider">
            <span class="sliderText">roll</span>
            <input id="rollSlider" type="range" min="-1000" max="1200" value="200" />
          </label>
          <label class="sliderRow" for="rotationSpeedSlider">
            <span class="sliderText">rotation speed</span>
            <input id="rotationSpeedSlider" type="range" min="0" max="2000" value="100" />
          </label>
        </div>
        <button id="resetControls" type="button">reset</button>
      </div>
    </div>
  </body>
</html>
