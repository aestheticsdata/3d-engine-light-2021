<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles/main.css">
    <script type="module" src="index.ts"></script>
  </head>

  <body>
    <div id="wrapper">
      <aside id="shapeInfoPanel" class="sidePanel">
        <div id="shapeInfoPanelContent" class="panelContent">
          <div class="panelHeader">
            <span class="panelTitle">shape info</span>
          </div>

          <div class="panelSection">
            <div class="infoRow">
              <span class="infoLabel">name</span>
              <span id="shapeInfoName" class="infoValue"></span>
            </div>
            <div class="infoRow">
              <span class="infoLabel">points</span>
              <span id="shapeInfoPoints" class="infoValue"></span>
            </div>
            <div class="infoRow">
              <span class="infoLabel">triangles</span>
              <span id="shapeInfoTriangles" class="infoValue"></span>
            </div>
            <div class="infoRow">
              <span class="infoLabel">textures</span>
              <span id="shapeInfoTextures" class="infoValue"></span>
            </div>
            <div class="infoRow">
              <span class="infoLabel">opacity</span>
              <span id="shapeInfoOpacity" class="infoValue"></span>
            </div>
          </div>

          <div class="panelSection">
            <span class="panelSubTitle">shape story</span>
            <h2 id="shapeStoryTitle" class="storyTitle"></h2>
            <p id="shapeStoryDescription" class="storyText"></p>
            <p id="shapeStoryFeature" class="storyText"></p>
            <div class="storyBadgeRow">
              <span class="statsBadge">
                <span class="statsLabel">DENSITY :</span>
                <span id="shapeStoryDensity" class="statsValue"></span>
              </span>
            </div>
            <div id="shapeStoryReferences" class="storyLinks"></div>
          </div>
        </div>
      </aside>

      <div id="canvasWrapper">
        <canvas id="canvasID" width="1024" height="640">canvas not available in this browser</canvas>
      </div>
      <aside id="controls" class="sidePanel">
        <div class="controlsHeader">
          <button id="playPause">pause</button>
          <div id="wireframeRow" class="toggleRow">
            <span id="wireframeLabel" class="toggleLabel">wireframe</span>
            <button id="toggleWireframe" type="button">on</button>
          </div>
          <div id="backfaceCullingRow" class="toggleRow">
            <span id="backfaceCullingLabel" class="toggleLabel">backface culling</span>
            <button id="toggleBackfaceCulling" type="button">off</button>
          </div>
          <div id="selectButton">
            <select id="primitives">
            </select>
          </div>
          <div class="fpsRow">
            <span class="statsBadge">
              <span class="statsLabel fpsCounter">FPS :</span>
              <span id="fpsCounterNb" class="statsValue fpsCounter"></span>
            </span>
            <span class="statsBadge statsBadgeRight">
              <span class="statsLabel fpsCounter">TRIANGLES :</span>
              <span id="trianglesRenderedNb" class="statsValue fpsCounter"></span>
            </span>
          </div>
        </div>
        <div class="sliderGroup">
          <label class="sliderRow" for="zoomSlider">
            <span class="sliderText">zoom</span>
            <input id="zoomSlider" type="range" min="0" max="100" value="50" />
          </label>
          <label class="sliderRow" for="opacitySlider">
            <span class="sliderText">opacity</span>
            <input id="opacitySlider" type="range" min="0" max="100" value="100" />
          </label>
          <label class="sliderRow" for="pitchSlider">
            <span class="sliderText">pitch</span>
            <input id="pitchSlider" type="range" min="0" max="800" value="400" />
          </label>
          <label class="sliderRow" for="yawSlider">
            <span class="sliderText">yaw</span>
            <input id="yawSlider" type="range" min="0" max="800" value="400" />
          </label>
          <label class="sliderRow" for="rollSlider">
            <span class="sliderText">roll</span>
            <input id="rollSlider" type="range" min="-1000" max="1200" value="200" />
          </label>
          <label class="sliderRow" for="rotationSpeedSlider">
            <span class="sliderText">rotation speed</span>
            <input id="rotationSpeedSlider" type="range" min="0" max="2000" value="100" />
          </label>
        </div>
        <button id="resetControls" type="button">reset</button>
      </aside>
    </div>
  </body>
</html>
